plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

def buildConfig = new Properties()
file('build.properties').withInputStream { buildConfig.load(it) }

group = 'karob.bigtrees'
version = buildConfig.getProperty('version', '0.3')
archivesBaseName = 'bigtrees'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mcVersion.set('1.7.10')
    username.set('Developer')
    injectedTags.put('VERSION', project.version.toString())
}

tasks.named('injectTags') {
    outputClassName.set('karob.bigtrees.Tags')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources') {
    def modVersion = project.version.toString()
    inputs.property('version', modVersion)
    filesMatching('mcmod.info') {
        expand(version: modVersion, mcversion: '1.7.10')
    }
}
